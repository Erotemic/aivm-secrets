# The separate project in garrett/ (its own CI is garrett/.github/workflows/ci.yml,
# which runs once it is its own repository); the same steps, run from garrett/.
name: garrett-stateless (garrett/)

on:
  push:
    branches: [main]
    paths: ['garrett/**', '.github/workflows/garrett-stateless.yml']
  pull_request:
    paths: ['garrett/**', '.github/workflows/garrett-stateless.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: garrett

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - name: Install swtpm and tpm2-tools for the optional TPM test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swtpm tpm2-tools
      - name: Rust build and tests (with and without the TPM signer)
        run: |
          cargo test --locked
          cargo build --locked -p garrett-stateless --features tpm --target-dir target/tpm
      - name: Python tests (interop uses the Rust build)
        run: |
          umask 077
          python -m pip install '.[tests]'
          GARRETT_REQUIRE_TPM_TESTS=1 python -m pytest -q
          python -m build
      - name: Shell guard
        run: python verification/shell_guard.py check
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - name: Install Lean manager
        run: |
          mkdir -p .tools/elan
          curl --fail --location https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz --output .tools/elan.tar.gz
          tar -xzf .tools/elan.tar.gz -C .tools/elan
          .tools/elan/elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Provision the pinned toolchain
        run: python verification/toolchain.py bootstrap
      - name: The committed Lean model is exactly the extracted Rust
        run: python verification/extract.py check
      - name: Prove
        run: cd proofs && lake build
      - name: Every security mutant breaks a proof
        run: python verification/mutate.py
