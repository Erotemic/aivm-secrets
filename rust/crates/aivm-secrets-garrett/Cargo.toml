[package]
name = "aivm-secrets-garrett"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
conformance = []
coordinator-server = ["dep:rusqlite"]

[dependencies]
aivm-secrets-garrett-core = { path = "../aivm-secrets-garrett-core" }
base64 = "0.22"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

rustls-pemfile = "2"
rustix = { version = "1", features = ["fs", "process", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
zeroize = "1"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "x509-parser", "zeroize"] }
x509-parser = { version = "0.18", features = ["verify"] }
time = "0.3"
rusqlite = { version = "=0.40.2", features = ["bundled"], optional = true }

[[bin]]
name = "garrett-conformance"
path = "src/main.rs"

[[bin]]
name = "garrett-bridge"
path = "src/bridge_main.rs"

[[bin]]
name = "garrett-client"
path = "src/client_main.rs"

[[bin]]
name = "garrett-authority"
path = "src/authority_main.rs"

[[bin]]
name = "garrett-oauth"
path = "src/oauth_main.rs"

[[bin]]
name = "garrett-coordinator"
path = "src/coordinator_main.rs"
required-features = ["coordinator-server"]

[[bin]]
name = "garrett-coordinatorctl"
path = "src/coordinator_ctl_main.rs"
