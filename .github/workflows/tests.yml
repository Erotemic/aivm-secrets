name: Standalone tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the standalone project
        run: |
          umask 077
          python -m pip install '.[tests]'
      - name: Run offline tests and distribution checks without AIVM
        run: python -m pytest -q
