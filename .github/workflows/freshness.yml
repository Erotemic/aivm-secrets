name: Rust freshness proof and parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: |
          umask 077
          python -m pip install '.[tests]'
      - name: Install the Lean toolchain manager
        run: |
          mkdir -p .tools/elan
          curl --fail --location https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz --output .tools/elan.tar.gz
          tar -xzf .tools/elan.tar.gz -C .tools/elan
          .tools/elan/elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Provision the pinned verification dependencies
        run: python dev/verification/freshness.py bootstrap
      - name: Regenerate, check proofs and compare with Python
        run: python dev/verification/freshness.py check
      - name: Require security mutations to break the Lean proofs
        run: python dev/verification/freshness.py mutate
