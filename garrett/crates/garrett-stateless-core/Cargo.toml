[package]
name = "garrett-stateless-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The pure garrett-stateless-v1 protocol decisions, extracted to Lean by Aeneas"
# Publishing needs the maintainer's approval.
publish = false

[features]
# `Debug`, `Clone`, `PartialEq` and `Eq` for the value and error types that
# carry no secret (never for credentials, tokens, keys or requests). Off by
# default, so the extracted crate, and therefore the Lean model, is exactly
# the code without these impls; no core function calls them.
derive = []

[dependencies]
