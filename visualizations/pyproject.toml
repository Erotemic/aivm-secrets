[project]
name = "aivm-secrets-visualizations"
version = "0.1.0"
description = "Editable Manim walkthrough of credential packaging and information movement"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
manim = ["manim>=0.19,<0.20", "manim-slides>=5.1,<6"]
pdf = ["cairosvg>=2.7,<3", "pypdf>=5,<7"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
