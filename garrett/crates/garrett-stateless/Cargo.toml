[package]
name = "garrett-stateless"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "garrett-stateless-v1: certificate-bound surrogate JWTs, an OAuth broker and a stateless mTLS credential-substitution proxy, after Matthew Garrett's \"Securing agentic identity\""
readme = "README.md"
keywords = ["oauth", "mtls", "jwt", "proxy", "agents"]
categories = ["authentication", "network-programming"]
# Release-ready but not published: publishing needs the maintainer's approval.
publish = false

[features]
default = []
# TPM 2.0 client keys through tpm2-tools (src/tpm.rs).
tpm = ["dep:rustix"]
# Fixed-nonce sealing for the conformance vectors (`token::fixture_seal`).
# Only this crate's tests enable it (the dev-dependency below).
fixtures = []

[dependencies]
garrett-stateless-core = { path = "../garrett-stateless-core", version = "0.1.0", features = ["derive"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
x509-parser = "0.18"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "x509-parser", "zeroize"] }
time = "0.3"
zeroize = "1"
rustix = { version = "1", features = ["fs", "process"], optional = true }

[dev-dependencies]
garrett-stateless = { path = ".", features = ["fixtures"] }

[[bin]]
name = "garrett-stateless"
path = "src/bin/garrett-stateless.rs"
