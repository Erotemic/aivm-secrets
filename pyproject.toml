# Standalone experimental broker distribution; no dependency on the VM manager.
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aivm-secrets"
version = "0.2.0"
readme = "README.md"
description = "Experimental credential-use broker and identity reference implementation"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Jon Crall", email = "erotemic@gmail.com"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = ["cryptography>=46.0.0"]

[project.scripts]
aivm-secrets = "aivm_secrets.cli:main"

[tool.setuptools]
include-package-data = false
packages = [
  "aivm_secrets",
  "aivm_secrets.host",
  "aivm_secrets.identity",
  "aivm_secrets.identity.garrett",
  "aivm_secrets.kernel",
  "aivm_secrets.primitives",
  "aivm_secrets.proxy",
  "aivm_secrets.transport",
]

[project.optional-dependencies]
tests = ["pytest>=7", "build>=1.2", "setuptools>=77", "wheel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["aivm_secrets"]
